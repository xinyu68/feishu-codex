name: Build Windows installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag $env:RELEASE_TAG does not match package version v$version" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify update metadata
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'release/win-unpacked/resources/app-update.yml')) { throw 'Installed app is missing its update source' }
          if (-not (Test-Path -LiteralPath 'release/latest.yml')) { throw 'Windows update manifest is missing' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ((Get-Content release/latest.yml -Raw) -notmatch "(?m)^version: $([regex]::Escape($version))$") { throw 'Update manifest version does not match package.json' }
      - name: Create checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lines = @("release/Feishu-Codex-$version-Setup.exe", "release/Feishu-Codex-$version-Setup.exe.blockmap", 'release/latest.yml') | Get-Item | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          name: Feishu-Codex-Windows-x64
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Attach update files to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @("release/Feishu-Codex-$version-Setup.exe", "release/Feishu-Codex-$version-Setup.exe.blockmap", 'release/latest.yml', 'release/SHA256SUMS.txt')
          foreach ($file in $files) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $file" } }
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release assets' }
          $names = $files | ForEach-Object { Split-Path -Leaf $_ }
          $existing = @($release.assets | Where-Object { $_.name -in $names })
          if ($existing.Count -eq $names.Count -and @($existing | Where-Object { $_.state -ne 'uploaded' -or $_.size -le 0 }).Count -eq 0) {
            Write-Host 'The release already has a complete asset set; preserving its published binaries and update metadata.'
          } elseif ($existing.Count -gt 0) {
            throw 'The release has a partial asset set. Verify it before uploading; existing assets will not be overwritten.'
          } else {
            gh release upload $env:RELEASE_TAG @files
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          }
